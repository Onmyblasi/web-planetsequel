<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEQUEL PLANET</title>
<meta name="description" content="Aprende SQL reparando un mecha en un planeta sin atmósfera.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/home.css">
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="backdrop"></div>
  <div class="stars" id="stars"></div>
  <div class="sun"></div>
  <div class="atmosphere"></div>
  <div class="planet"></div>
  <div class="haze"></div>
</div>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="layer">

  <header class="topbar">

    <div class="avatar" id="avatar">
      <span class="helmet" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M6 15a10 10 0 0 1 20 0v7a5 5 0 0 1-5 5H11a5 5 0 0 1-5-5v-7Z"
                fill="#16222a" stroke="#4b616d" stroke-width="1.3"/>
          <path d="M8.5 14.5a7.5 7.5 0 0 1 15 0v3.2a1.3 1.3 0 0 1-1.3 1.3H9.8a1.3 1.3 0 0 1-1.3-1.3v-3.2Z"
                fill="#7fb8a4" fill-opacity=".55"/>
          <path d="M13 23h6" stroke="#4b616d" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M4 16.5h2M26 16.5h2" stroke="#4b616d" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="avatar-info">
        <span class="avatar-name" id="avatarName">—</span><br>
        <span class="avatar-status" id="avatarStatus">MODO LOCAL</span>
      </span>
    </div>

    <div class="lang">
      <button class="lang-btn" id="langBtn" aria-haspopup="true"
              aria-expanded="false" aria-label="Idioma / Language">
        <span class="query-btn">
          <span class="l1"><span class="kw">SELECT</span> language</span>
          <span class="l2"><span class="kw">FROM</span> languages;</span>
        </span>
        <span class="caret">▼</span>
      </button>
      <div class="lang-menu" id="langMenu" role="menu">
        <button class="lang-option" role="menuitemradio" aria-checked="true" data-lang="es">
          <span class="n">1</span><span>Español</span>
        </button>
        <button class="lang-option" role="menuitemradio" aria-checked="false" data-lang="en">
          <span class="n">2</span><span>English</span>
        </button>
      </div>
    </div>

  </header>

  <main class="center">

    <h1 class="wordmark">
      <span class="wordmark-main">SEQUEL</span>
      <span class="wordmark-sub" aria-hidden="true"><i>P</i><i>L</i><i>A</i><i>N</i><i>E</i><i>T</i></span>
      <span class="sr-only">Planet</span>
    </h1>
    <p class="tagline" id="tagline">APRENDE SQL Y HAZ CRECER VIDA</p>

    <!-- 1 · access -->
    <section class="view on" id="viewAccess">
      <div class="actions">
        <button class="btn btn-primary" id="btnSignIn">INICIAR SESIÓN</button>
        <button class="btn" id="btnSignUp">CREAR CUENTA</button>
        <button class="btn btn-link" id="btnGuest">Continuar sin iniciar sesión</button>
      </div>
    </section>

    <!-- 2 · sign in -->
    <section class="view" id="viewSignIn">
      <div class="view-title" id="titleSignIn">INICIAR SESIÓN</div>
      <form id="formSignIn" novalidate>
        <div class="field">
          <label for="signInEmail" id="labelEmail">CORREO</label>
          <input type="email" id="signInEmail" autocomplete="off" disabled>
        </div>
        <div class="field">
          <label for="signInPass" id="labelPass">CONTRASEÑA</label>
          <input type="password" id="signInPass" autocomplete="off" disabled>
        </div>
        <p class="form-note" id="noteSignIn"></p>
      </form>
      <button class="back" data-back="viewAccess">← Volver</button>
    </section>

    <!-- 3 · sign up -->
    <section class="view" id="viewSignUp">
      <div class="view-title" id="titleSignUp">CREAR CUENTA</div>
      <form id="formSignUp" novalidate>
        <div class="field">
          <label for="signUpName" id="labelName">NOMBRE</label>
          <input type="text" id="signUpName" autocomplete="off" disabled>
        </div>
        <div class="field">
          <label for="signUpEmail" id="labelEmail2">CORREO</label>
          <input type="email" id="signUpEmail" autocomplete="off" disabled>
        </div>
        <div class="field">
          <label for="signUpPass" id="labelPass2">CONTRASEÑA</label>
          <input type="password" id="signUpPass" autocomplete="off" disabled>
        </div>
        <p class="form-note" id="noteSignUp"></p>
      </form>
      <button class="back" data-back="viewAccess">← Volver</button>
    </section>

    <!-- 4 · playing without an account -->
    <section class="view" id="viewGuest">
      <div class="confirm">
        <div class="confirm-title" id="guestTitle">SIN CUENTA</div>
        <p class="confirm-text" id="guestText"></p>
        <div class="confirm-actions">
          <button class="btn btn-primary" id="btnGoOn">CONTINUAR ASÍ</button>
          <button class="btn" id="btnCancel">VOLVER</button>
        </div>
      </div>
    </section>

    <!-- 5 · game menu -->
    <section class="view" id="viewMenu">
      <div class="actions">
        <button class="btn btn-primary" id="btnContinue" hidden>CONTINUAR PARTIDA</button>
        <button class="btn btn-primary" id="btnNew">NUEVA PARTIDA</button>
        <button class="btn" id="btnOptions">OPCIONES</button>
      </div>
      <button class="back" id="btnExit">← Cambiar de acceso</button>
    </section>

  </main>

  <footer class="footer">
    <span>SEQUELPLANET.COM</span>
    <button class="sound" id="soundBtn" aria-pressed="false">
      <span class="sound-dot"></span><span id="soundLabel">ACTIVAR SONIDO</span>
    </button>
  </footer>

</div>

<script src="scripts/audio.js"></script>
<script src="scripts/language.js"></script>
<script src="scripts/home.js"></script>

</body>
</html>
